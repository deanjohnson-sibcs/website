<svg width="1920" height="900" viewBox="0 0 1920 900" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Abstract connected financial data network background</title>
<defs>
<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#0b1f3a"/>
<stop offset="55%" stop-color="#0e2a4a"/>
<stop offset="100%" stop-color="#123a52"/>
</linearGradient>
<linearGradient id="lineFade" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#3fa9c9" stop-opacity="0"/>
<stop offset="50%" stop-color="#3fa9c9" stop-opacity="0.55"/>
<stop offset="100%" stop-color="#3fa9c9" stop-opacity="0"/>
</linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#2fd6c4" stop-opacity="0.25"/>
<stop offset="100%" stop-color="#2fd6c4" stop-opacity="0"/>
</radialGradient>
</defs>

<rect width="1920" height="900" fill="url(#bg)"/>

<!-- soft ambient glows -->
<circle cx="1500" cy="200" r="420" fill="url(#glow)"/>
<circle cx="300" cy="700" r="380" fill="url(#glow)"/>

<!-- faint grid suggesting structured data -->
<g stroke="#3fa9c9" stroke-opacity="0.06" stroke-width="1">
<line x1="0" y1="150" x2="1920" y2="150"/>
<line x1="0" y1="300" x2="1920" y2="300"/>
<line x1="0" y1="450" x2="1920" y2="450"/>
<line x1="0" y1="600" x2="1920" y2="600"/>
<line x1="0" y1="750" x2="1920" y2="750"/>
<line x1="240" y1="0" x2="240" y2="900"/>
<line x1="480" y1="0" x2="480" y2="900"/>
<line x1="720" y1="0" x2="720" y2="900"/>
<line x1="960" y1="0" x2="960" y2="900"/>
<line x1="1200" y1="0" x2="1200" y2="900"/>
<line x1="1440" y1="0" x2="1440" y2="900"/>
<line x1="1680" y1="0" x2="1680" y2="900"/>
</g>

<!-- connective network: nodes and edges representing linked financial data -->
<g stroke="#3fa9c9" stroke-opacity="0.35" stroke-width="1.2" fill="none">
<path d="M180 620 L420 480 L680 560 L920 380 L1180 460 L1440 260 L1700 340"/>
<path d="M420 480 L560 260"/>
<path d="M680 560 L780 760"/>
<path d="M920 380 L1040 180"/>
<path d="M1180 460 L1300 660"/>
<path d="M1440 260 L1560 100"/>
</g>

<g fill="#7fe0d4">
<circle cx="180" cy="620" r="5"/>
<circle cx="420" cy="480" r="5"/>
<circle cx="680" cy="560" r="5"/>
<circle cx="920" cy="380" r="6"/>
<circle cx="1180" cy="460" r="5"/>
<circle cx="1440" cy="260" r="6"/>
<circle cx="1700" cy="340" r="5"/>
<circle cx="560" cy="260" r="4"/>
<circle cx="780" cy="760" r="4"/>
<circle cx="1040" cy="180" r="4"/>
<circle cx="1300" cy="660" r="4"/>
<circle cx="1560" cy="100" r="4"/>
</g>

<!-- rising bar motif, lower right, subtle -->
<g fill="#3fa9c9" fill-opacity="0.18">
<rect x="1620" y="720" width="26" height="80"/>
<rect x="1660" y="670" width="26" height="130"/>
<rect x="1700" y="600" width="26" height="200"/>
<rect x="1740" y="540" width="26" height="260"/>
<rect x="1780" y="470" width="26" height="330"/>
</g>

<!-- horizontal accent line -->
<rect x="0" y="440" width="1920" height="2" fill="url(#lineFade)"/>

</svg>
